<!DOCTYPE html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Հարթաչափություն — ինտերակտիվ թվային դասագիրք</title>
<meta name="author" content="Սուսաննա Լեռնիկի Հովհաննիսյան">
<style>:root{
  --ink:#1c2333; --muted:#5b6475; --bg:#f4f6fb; --card:#ffffff; --line:#e3e7f0;
  --accent:#2457d6; --accent-soft:#e8eefc; --red:#d6334f; --red-soft:#fdecef;
  --green:#178a4c; --green-soft:#e6f6ec; --amber:#b86e00; --amber-soft:#fff4df;
  --violet:#6d3fd1; --violet-soft:#f0eafc; --radius:14px;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 16px rgba(20,30,60,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Noto Sans Armenian","Arial AMU","Mardoto","Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;font-size:16.5px}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line)}
.topbar .brand{font-weight:700;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand small{font-weight:400;color:var(--muted);margin-left:8px}
.menu-btn{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px}
.prog-pill{font-size:13px;background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:99px;white-space:nowrap}
.layout{display:flex;min-height:calc(100vh - 54px)}
nav.side{width:300px;flex:none;background:#fff;border-right:1px solid var(--line);padding:14px 10px 40px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
nav.side h4{margin:16px 10px 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
nav.side a{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.35}
nav.side a:hover{background:var(--bg)}
nav.side a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.side a .num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
nav.side a.done .num{background:var(--green);color:#fff}
main{flex:1;min-width:0;padding:26px 28px 80px;max-width:1020px}
h1{font-size:30px;line-height:1.25;margin:0 0 8px}
h2{font-size:23px;margin:30px 0 10px}
h3{font-size:19px;margin:22px 0 8px}
.lead{font-size:18px;color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:14px 0;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,#1e3f9e,#2f6ae8 60%,#5b8cf2);color:#fff;border-radius:22px;padding:34px 32px;margin-bottom:20px;position:relative;overflow:hidden}
.hero h1{color:#fff;font-size:34px}
.hero p{color:#e4ebff;font-size:18px;max-width:640px}
.hero .author{margin-top:16px;font-size:15px;color:#fff;opacity:.95}
.hero svg{position:absolute;right:-30px;bottom:-30px;opacity:.22}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);display:block;box-shadow:var(--shadow);transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile b{display:block;margin-bottom:4px}
.tile span{color:var(--muted);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
details.sec{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin:12px 0;box-shadow:var(--shadow)}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:700;font-size:17.5px;display:flex;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .ix{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
details.sec>summary::after{content:"＋";margin-left:auto;color:var(--muted);font-weight:400}
details.sec[open]>summary::after{content:"－"}
details.sec>.body{padding:2px 20px 18px}
.def{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.def b{color:var(--accent)}
.formula{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1px dashed #b9c6ea;background:#fbfcff;border-radius:12px;padding:10px 14px;margin:8px 0}
.formula .fx{font-size:20px;font-family:"Cambria Math","Times New Roman",serif}
.formula .fn{color:var(--muted);font-size:14.5px;flex:1;min-width:200px}
.note{background:var(--amber-soft);border-left:4px solid var(--amber);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.warn{background:var(--red-soft);border-left:4px solid var(--red);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.good{background:var(--green-soft);border-left:4px solid var(--green);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.secret{background:var(--violet-soft);border-left:4px solid var(--violet);padding:12px 16px;border-radius:0 12px 12px 0;margin:12px 0}
.secret h4{margin:0 0 6px;color:var(--violet)}
.m{font-family:"Cambria Math","Times New Roman",serif;font-size:1.08em;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;font-size:.92em;line-height:1.15}
.fr>span:first-child{border-bottom:1.3px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.sq{white-space:nowrap}.sq>span{border-top:1.3px solid currentColor;padding:0 1px;margin-left:1px}
.vec{display:inline-block;position:relative;padding-top:.35em}
.vec::before{content:"";position:absolute;left:1px;right:2px;top:.18em;border-top:1.3px solid currentColor}
.vec::after{content:"";position:absolute;right:0;top:-.02em;border:solid currentColor;border-width:1.3px 1.3px 0 0;width:.3em;height:.3em;transform:rotate(45deg)}
.fig{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:10px 0}
.fig figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;max-width:100%}
.fig figcaption{font-size:13.5px;color:var(--muted);margin-top:4px;max-width:340px}
.fig svg{max-width:100%;height:auto}
.example{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:12px 0;background:#fff}
.example .q{font-weight:600}
.steps{margin:8px 0 0;padding-left:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;position:relative;padding:6px 0 6px 38px;border-top:1px dashed var(--line)}
.steps li::before{content:counter(st);position:absolute;left:0;top:6px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.steps li.hidden{display:none}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:7px 14px;font-size:15px}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.small{padding:4px 10px;font-size:14px}
.btn.green{background:var(--green);border-color:var(--green)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ex{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff}
.ex .q{margin-bottom:8px}
.ex input[type=text]{border:1px solid #c9d1e3;border-radius:9px;padding:6px 10px;width:170px}
.fb{margin-top:8px;padding:8px 12px;border-radius:9px;display:none}
.fb.ok{display:block;background:var(--green-soft);color:#0f5a32}
.fb.no{display:block;background:var(--red-soft);color:#8b1a2f}
.fb.info{display:block;background:var(--accent-soft);color:#1c3b8a}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.opt{border:1px solid #c9d1e3;background:#fff;border-radius:10px;padding:6px 12px;min-width:70px;text-align:left}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--green-soft);border-color:var(--green);color:#0f5a32;font-weight:600}
.opt.wrong{background:var(--red-soft);border-color:var(--red);color:#8b1a2f}
.bank{border:1px solid #d6def0;border-radius:14px;padding:14px 16px;margin:16px 0;background:#fff}
.bank .src{font-size:13px;color:#fff;background:#3a4b7a;display:inline-block;padding:2px 10px;border-radius:99px;margin-bottom:8px}
.bank .stem{font-weight:600;font-size:17px}
.phase{border-radius:10px;padding:10px 14px;margin:10px 0}
.phase h4{margin:0 0 6px;font-size:15.5px}
.p1{background:#f3f6ff}.p2{background:#fbfbf3}.p3{background:#f3fbf6}
.sub{border-top:1px dashed var(--line);padding:10px 0}
.sub .sq-title{font-weight:600}
.sol{display:none;margin-top:6px;background:#fafbfe;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.sol.show{display:block}
.tf{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--muted);margin-right:6px}
.badge.a{background:#e8f6ee;color:#14693c}.badge.b{background:#fff3dd;color:#8a5200}.badge.c{background:#fde8ec;color:#952036}
table.t{border-collapse:collapse;width:100%;font-size:14.5px;background:#fff}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
table.t th{background:#f0f3fa}
.tbl-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.summary li{margin:4px 0}
.game{border:2px solid #d9e2fb;border-radius:16px;padding:14px 16px;background:linear-gradient(180deg,#fff,#f7f9ff);margin:12px 0}
.game h4{margin:0 0 4px}
.game .goal{color:var(--muted);font-size:14px;margin-bottom:8px}
.score{font-weight:700;color:var(--accent)}
.chip{display:inline-block;border:1px solid #c9d1e3;background:#fff;border-radius:10px;padding:6px 12px;margin:4px;cursor:pointer;user-select:none}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.chip.done{border-color:var(--green);background:var(--green-soft);cursor:default;opacity:.85}
.chip.bad{border-color:var(--red);background:var(--red-soft)}
.order li{list-style:none;border:1px solid #c9d1e3;border-radius:10px;padding:6px 10px;margin:6px 0;background:#fff;display:flex;gap:8px;align-items:center}
.order{padding:0}
.order li button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:0 8px}
.widget{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0}
.widget .ctrl{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:15px;margin:6px 4px}
.widget .readout{font-family:"Cambria Math","Times New Roman",serif;font-size:17px;background:#f6f8fd;border-radius:10px;padding:8px 12px;margin:6px 4px}
.prereq{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.prereq span{background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13.5px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:13px;background:#fff}
.mark-read{margin-top:18px}
.hide{display:none!important}
.navfoot{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
@media (max-width:900px){
  .menu-btn{display:inline-block}
  nav.side{position:fixed;left:0;top:54px;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  nav.side.open{transform:none}
  main{padding:18px 14px 70px}
  h1{font-size:25px}.hero h1{font-size:27px}.hero{padding:24px 20px}
  .topbar .brand{display:none}
  .prog-pill{margin-left:auto}
}
@media print{
  nav.side,.topbar,.btn,.navfoot{display:none!important}
  main{max-width:none;padding:0}
  details.sec{break-inside:avoid}
}
</style></head>
<body><div class="topbar"><button class="menu-btn" aria-label="Մենյու">☰ Բովանդակություն</button><div class="brand">Հարթաչափություն <small>ինտերակտիվ դասագիրք · ընդունելության քննությունների նախապատրաստում</small></div><span class="prog-pill"></span></div>
<div class="layout"><nav class="side"></nav><main></main></div>
<script>
/* ---- engine.js ---- */
/* ===== Հարթաչափություն — ինտերակտիվ դասագրքի շարժիչ ===== */
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const h = (tag, attrs = {}, html = "") => { const e = document.createElement(tag); for (const k in attrs) { if (k === "class") e.className = attrs[k]; else if (k.startsWith("on")) e[k] = attrs[k]; else e.setAttribute(k, attrs[k]); } if (html !== undefined && html !== null) e.innerHTML = html; return e; };

/* ---------- Մաթեմատիկական նշագրում ---------- */
function matchBrace(s, k) { let d = 0; for (let j = k; j < s.length; j++) { if (s[j] === "{") d++; else if (s[j] === "}") { d--; if (d === 0) return j; } } return s.length - 1; }
function splitTop(s) { let d = 0; for (let j = 0; j < s.length; j++) { const c = s[j]; if (c === "{") d++; else if (c === "}") d--; else if (c === "|" && d === 0) return [s.slice(0, j), s.slice(j + 1)]; } return [s, ""]; }
function fmt(s) {
  if (s === undefined || s === null) return "";
  s = String(s); let out = ""; let k = 0;
  while (k < s.length) {
    if (s.startsWith("{{", k)) { const e = matchBrace(s, k); const [a, b] = splitTop(s.slice(k + 2, e - 1)); out += `<span class="fr"><span>${fmt(a)}</span><span>${fmt(b)}</span></span>`; k = e + 1; continue; }
    if (s.startsWith("√{", k)) { const e = matchBrace(s, k + 1); out += `<span class="sq">√<span>${fmt(s.slice(k + 2, e))}</span></span>`; k = e + 1; continue; }
    if (s[k] === "√") { const m = /^√(\d+(?:[.,]\d+)?|[a-zA-Zα-ω])/.exec(s.slice(k)); if (m) { out += `<span class="sq">√<span>${m[1]}</span></span>`; k += m[0].length; continue; } }
    if (s.startsWith("→{", k)) { const e = matchBrace(s, k + 1); out += `<span class="vec">${fmt(s.slice(k + 2, e))}</span>`; k = e + 1; continue; }
    if (s.startsWith("^{", k)) { const e = matchBrace(s, k + 1); out += `<sup>${fmt(s.slice(k + 2, e))}</sup>`; k = e + 1; continue; }
    if (s.startsWith("_{", k)) { const e = matchBrace(s, k + 1); out += `<sub>${fmt(s.slice(k + 2, e))}</sub>`; k = e + 1; continue; }
    if (s[k] === "^" && k + 1 < s.length) { const m = /^\^(\d+|[a-zA-Z°′])/.exec(s.slice(k)); if (m) { out += `<sup>${m[1]}</sup>`; k += m[0].length; continue; } }
    if (s[k] === "_" && k + 1 < s.length && /[0-9a-zA-Z]/.test(s[k + 1]) && k > 0 && /[A-Za-zA-Z)a-z\]]/.test(s[k - 1])) { const m = /^_(\d+|[a-zA-Z])/.exec(s.slice(k)); out += `<sub>${m[1]}</sub>`; k += m[0].length; continue; }
    out += s[k]; k++;
  }
  return out;
}

/* ---------- Պատասխանների ստուգում ---------- */
function evalExpr(str) {
  if (typeof str === "number") return str;
  let s = String(str).trim().toLowerCase()
    .replace(/−|–|—/g, "-").replace(/,/g, ".").replace(/×|·|⋅/g, "*").replace(/÷|:/g, "/")
    .replace(/\s+/g, "").replace(/սմ|մմ|դմ|մ|°|աստիճան/g, "").replace(/pi|π|պի/g, "π").replace(/sqrt|v(?=[\d(])/g, "√");
  const t = []; let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/[0-9.]/.test(c)) { let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++; t.push({ n: parseFloat(s.slice(i, j)) }); i = j; continue; }
    if ("+-*/^()√π".includes(c)) { t.push({ o: c }); i++; continue; }
    if (c === "²") { t.push({ o: "^" }); t.push({ n: 2 }); i++; continue; }
    return NaN;
  }
  let p = 0;
  const peek = () => t[p];
  const startsAtom = (x) => x && (x.n !== undefined || x.o === "(" || x.o === "√" || x.o === "π");
  function expr() { let v = term(); while (peek() && (peek().o === "+" || peek().o === "-")) { const o = t[p++].o; const r = term(); v = o === "+" ? v + r : v - r; } return v; }
  function term() { let v = unary(); while (peek() && (peek().o === "*" || peek().o === "/" || startsAtom(peek()))) { let o = "*"; if (peek().o === "*" || peek().o === "/") o = t[p++].o; const r = unary(); v = o === "*" ? v * r : v / r; } return v; }
  function unary() { if (peek() && peek().o === "-") { p++; return -unary(); } if (peek() && peek().o === "+") { p++; return unary(); } return power(); }
  function power() { let b = atom(); if (peek() && peek().o === "^") { p++; const e = unary(); b = Math.pow(b, e); } return b; }
  function atom() {
    const x = t[p++]; if (!x) return NaN;
    if (x.n !== undefined) return x.n;
    if (x.o === "π") return Math.PI;
    if (x.o === "√") return Math.sqrt(power());
    if (x.o === "(") { const v = expr(); if (peek() && peek().o === ")") p++; return v; }
    return NaN;
  }
  try { const v = expr(); return p === t.length ? v : NaN; } catch (e) { return NaN; }
}
function near(a, b) { return isFinite(a) && isFinite(b) && Math.abs(a - b) <= 1e-6 + 1e-4 * Math.abs(b); }
function checkAnswer(input, ans) {
  const raw = String(input).trim();
  if (!raw) return false;
  if (ans && typeof ans === "object" && !Array.isArray(ans) && ans.t) { const v = raw.toLowerCase().replace(/\s+/g, " "); return ans.t.some((x) => v === x.toLowerCase()); }
  if (Array.isArray(ans)) {
    const parts = raw.replace(/[(){}\[\]]/g, "").split(/;|\s(?=[-−]?\d)/).map((x) => x.trim()).filter(Boolean);
    if (parts.length !== ans.length) return false;
    return ans.every((a, i) => near(evalExpr(parts[i]), evalExpr(a)));
  }
  return near(evalExpr(raw), evalExpr(ans));
}

/* ---------- Պահպանում (առաջադիմություն) ---------- */
const Store = {
  k: "harthachaputyun_susanna_v1", d: null,
  load() { try { this.d = JSON.parse(localStorage.getItem(this.k)) || {}; } catch (e) { this.d = this.d || {}; } if (!this.d.l) this.d.l = {}; if (!this.d.g) this.d.g = {}; if (!this.d.log) this.d.log = []; },
  save() { try { localStorage.setItem(this.k, JSON.stringify(this.d)); } catch (e) {} },
  les(id) { if (!this.d.l[id]) this.d.l[id] = { read: 0, ex: {}, bank: {}, test: 0 }; return this.d.l[id]; },
  log(msg) { this.d.log.unshift({ t: new Date().toLocaleString("hy-AM"), m: msg }); this.d.log = this.d.log.slice(0, 80); this.save(); },
};
function lessonPct(L) {
  const s = Store.les(L.id);
  const exT = (L.exercises || []).length || 1, bkT = countBankSubs(L) || 1;
  const exD = Object.keys(s.ex).length, bkD = Object.keys(s.bank).length;
  return Math.round(20 * (s.read ? 1 : 0) + 30 * Math.min(1, exD / exT) + 25 * Math.min(1, bkD / bkT) + 25 * (s.test || 0) / 100);
}
function countBankSubs(L) { return (L.bank || []).reduce((a, b) => a + b.subs.length, 0); }
function totalPct() { const ls = window.LESSONS; return Math.round(ls.reduce((a, L) => a + lessonPct(L), 0) / ls.length); }

/* ---------- Գծագրեր ---------- */
const SVGNS = "http://www.w3.org/2000/svg";

function sec(i, title, body, open) { return `<details class="sec" ${open ? "open" : ""}><summary><span class="ix">${i}</span>${title}</summary><div class="body">${body}</div></details>`; }
function renderLesson(id) {

  html += `<div class="card"><b>Նախնական գիտելիքներ, որոնք պետք են այս դասից առաջ</b><div class="prereq">${(L.prereq || []).map((p) => `<span>${fmt(p)}</span>`).join("")}</div><b>Դասի նպատակը</b><div>${fmt(L.goal || "")}</div><div class="bar"><i style="width:${lessonPct(L)}%"></i></div><div style="font-size:13px;color:#5b6475">Դասի յուրացում՝ ${lessonPct(L)}%</div></div>`;

  html += sec(n++, SECT[6], L.tips.map((t) => `<div class="secret"><h4>${fmt(t[0])}</h4>${fmt(t[1])}</div>`).join(""));
  html += sec(n++, SECT[7], L.mistakes.map((m) => `<div class="warn"><b>Սխալ.</b> ${fmt(m[0])}</div><div class="good" style="margin-top:-4px"><b>Ինչպե՞ս խուսափել.</b> ${fmt(m[1])}</div>`).join(""));
  html += sec(n++, SECT[8], `<p>Գրի՛ր պատասխանը թվով կամ արտահայտությամբ։ Կարելի է գրել, օրինակ, <span class="kbd">2√3</span>, <span class="kbd">3/4</span>, <span class="kbd">12,5</span>, <span class="kbd">(2; -1)</span>։</p>` + L.exercises.map((x, i) => exerciseHTML(x, "e" + i)).join(""));
  html += sec(n++, SECT[9], (L.bankIntro ? `<p>${fmt(L.bankIntro)}</p>` : "") + (L.bank || []).map((B, i) => bankHTML(B, "b" + i)).join("") + (L.bankMore ? `<div class="note"><b>Նույնատիպ առաջադրանքներ շտեմարանում.</b> ${fmt(L.bankMore)} Բոլորի ցանկը՝ <a href="#catalog-${L.id}">«Շտեմարանի առաջադրանքների ցանկ» բաժնում</a>։</div>` : ""));
  html += sec(n++, SECT[10], (L.games || []).map((g, i) => `<div class="game" data-g="${i}"></div>`).join("") || "<p>Այս թեմայի խաղերը տե՛ս «Խաղեր» բաժնում։</p>");

    const els = [["grid", 1, true, 0], ["vec", ["O", "A"], { c: "r", l: "a" }], ["vec", ["O", "Bp"], { c: "g", l: "b" }]];
    let txt;
    if (mode === 0) { els.push(["seg", ["A", "S"], { c: "m", d: 1 }], ["seg", ["Bp", "S"], { c: "m", d: 1 }], ["vec", ["O", "S"], { c: "b", l: "a+b" }]); txt = `→{a} + →{b} = {${a[0]} + ${b[0]}; ${a[1]} + ${b[1]}} = <b>{${a[0] + b[0]}; ${a[1] + b[1]}}</b> (զուգահեռագծի կանոն)`; }
    else if (mode === 1) { els.push(["vec", ["Bp", "A"], { c: "b", l: "a−b" }]); txt = `→{a} − →{b} = {${a[0] - b[0]}; ${a[1] - b[1]}}։ Տարբերության վեկտորը սկսվում է →{b}-ի ծայրից և ավարտվում →{a}-ի ծայրում։`; }
    else { els.push(["vec", ["O", "K"], { c: "v", l: "ka", w: 3.4 }]); txt = `k·→{a} = {${R2(k * a[0])}; ${R2(k * a[1])}}, |k·→{a}| = |k|·|→{a}| ≈ ${R2(Math.abs(k) * Math.hypot(...a))}։ ${k > 0 ? "k > 0 ⇒ համուղղված" : k < 0 ? "k < 0 ⇒ հակուղղված" : "k = 0 ⇒ զրոյական վեկտոր"}`; }
    B.render({ P, el: els });
    B.show(`→{a}{${a[0]}; ${a[1]}}, |→{a}| ≈ ${R2(Math.hypot(...a))}; →{b}{${b[0]}; ${b[1]}}, |→{b}| ≈ ${R2(Math.hypot(...b))}<br>` + txt);

  B.handle(() => a, (q) => { a[0] = snap(q[0], 1); a[1] = snap(q[1], 1); up(); }, "#d6334f"); B.handle(() => b, (q) => { b[0] = snap(q[0], 1); b[1] = snap(q[1], 1); up(); }, "#178a4c");
  up();
};

WIDGETS.dot = (el) => {

WIDGETS.isosceles = (el) => {

/* ===== Ուսուցողական խաղեր ===== */
"use strict";
const GAMES = {};
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function gameShell(el, cfg, icon) { el.innerHTML = `<h4>${icon || "🎯"} ${fmt(cfg.title)}</h4><div class="goal">${fmt(cfg.goal || "")}</div><div class="gbody"></div>`; return $(".gbody", el); }

/* Արագ թեստ՝ ժամանակի սահմանափակմամբ */
GAMES.quiz = (el, cfg, save) => {
  const body = gameShell(el, cfg, "⏱");
  const start = () => {
    const qs = shuffle(cfg.qs).slice(0, cfg.n || 8); let i = 0, ok = 0, left = cfg.time || 90; let tm;
    const end = () => { clearInterval(tm); const sc = Math.round((100 * ok) / qs.length); body.innerHTML = `<p>Արդյունք՝ <span class="score">${ok}/${qs.length}</span> (${sc}%)։ ${grade(sc)}</p><button class="btn small">Նորից խաղալ</button>`; $("button", body).onclick = start; save(sc); };
    const show = () => {
      if (i >= qs.length) return end(); const q = qs[i]; const order = shuffle(q.o.map((o, j) => j));
      body.innerHTML = `<div class="row"><span class="badge">Հարց ${i + 1}/${qs.length}</span><span class="badge">Ճիշտ՝ ${ok}</span><span class="badge">⏱ <span class="timer">${left}</span> վրկ</span></div><div class="q" style="margin:8px 0">${fmt(q.q)}</div><div class="opts">${order.map((j) => `<button class="opt" data-j="${j}">${fmt(q.o[j])}</button>`).join("")}</div><div class="fb"></div>`;
      $$(".opt", body).forEach((b) => (b.onclick = () => { $$(".opt", body).forEach((x) => (x.disabled = true)); const j = +b.dataset.j; if (j === q.a) { ok++; b.classList.add("right"); } else { b.classList.add("wrong"); $$(".opt", body).find((x) => +x.dataset.j === q.a).classList.add("right"); const fb = $(".fb", body); fb.className = "fb no"; fb.innerHTML = fmt(q.w || ""); } setTimeout(() => { i++; show(); }, j === q.a ? 600 : 1800); }));
    };
    tm = setInterval(() => { left--; const t = $(".timer", body); if (t) t.textContent = left; if (left <= 0) end(); }, 1000);
    show();
  };
  body.innerHTML = `<button class="btn small">Սկսել</button>`; $("button", body).onclick = start;
};

/* Համապատասխանեցում (բանաձև ↔ անվանում) */
GAMES.match = (el, cfg, save) => {
  const body = gameShell(el, cfg, "🧩");
  const start = () => {
    const pairs = shuffle(cfg.pairs).slice(0, cfg.n || 6); let sel = null, done = 0, miss = 0;
    const L = shuffle(pairs.map((p, i) => ({ i, t: p[0] }))), Rr = shuffle(pairs.map((p, i) => ({ i, t: p[1] })));
    body.innerHTML = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div>${L.map((x) => `<div class="chip" data-s="L" data-i="${x.i}">${fmt(x.t)}</div>`).join("")}</div><div>${Rr.map((x) => `<div class="chip" data-s="R" data-i="${x.i}">${fmt(x.t)}</div>`).join("")}</div></div><div class="fb"></div>`;
    $$(".chip", body).forEach((c) => (c.onclick = () => {
      if (c.classList.contains("done")) return;
      if (!sel || sel.dataset.s === c.dataset.s) { $$(".chip", body).forEach((x) => x.classList.remove("sel")); sel = c; c.classList.add("sel"); return; }
      if (sel.dataset.i === c.dataset.i) { sel.classList.remove("sel"); sel.classList.add("done"); c.classList.add("done"); done++; sel = null; if (done === pairs.length) { const sc = Math.max(0, Math.round(100 - (100 * miss) / (pairs.length * 2))); const fb = $(".fb", body); fb.className = "fb ok"; fb.innerHTML = `Բոլորը ճիշտ են համապատասխանեցված։ Սխալներ՝ ${miss}։ Միավոր՝ ${sc}։ <button class="btn small">Նորից</button>`; $("button", fb).onclick = start; save(sc); } }
      else { miss++; c.classList.add("bad"); setTimeout(() => c.classList.remove("bad"), 500); }
    }));
  };
  start();
};

/* Քայլ առ քայլ լուծում՝ քայլերը դասավորել ճիշտ հերթականությամբ */
GAMES.order = (el, cfg, save) => {
  const body = gameShell(el, cfg, "🪜");
  const start = () => {
    let cur = shuffle(cfg.steps.map((s, i) => i)); while (cur.every((v, i) => v === i) && cfg.steps.length > 1) cur = shuffle(cur);
    const paint = () => { body.innerHTML = `<div class="q">${fmt(cfg.task)}</div><ul class="order">${cur.map((k, p) => `<li><button data-p="${p}" data-d="-1">▲</button><button data-p="${p}" data-d="1">▼</button><span>${fmt(cfg.steps[k])}</span></li>`).join("")}</ul><button class="btn small chk">Ստուգել</button><div class="fb"></div>`;
      $$("li button", body).forEach((b) => (b.onclick = () => { const p = +b.dataset.p, d = +b.dataset.d; const q = p + d; if (q < 0 || q >= cur.length) return; [cur[p], cur[q]] = [cur[q], cur[p]]; paint(); }));
      $(".chk", body).onclick = () => { const okN = cur.filter((v, i) => v === i).length; const fb = $(".fb", body); if (okN === cur.length) { fb.className = "fb ok"; fb.innerHTML = "Հիանալի՛ է, լուծման տրամաբանությունը ճիշտ է։ <button class='btn small'>Նորից</button>"; $("button", fb).onclick = start; save(100); } else { fb.className = "fb no"; fb.innerHTML = `Ճիշտ տեղում է ${okN} քայլ ${cur.length}-ից։ Մտածի՛ր՝ ի՞նչ է պետք իմանալ յուրաքանչյուր քայլից առաջ։`; } }; };
    paint();
  };
  start();
};

/* Գտի՛ր սխալը լուծման մեջ */
GAMES.error = (el, cfg, save) => {
  const body = gameShell(el, cfg, "🔍"); let k = 0, ok = 0;
  const show = () => {
    if (k >= cfg.items.length) { const sc = Math.round((100 * ok) / cfg.items.length); body.innerHTML = `<p>Գտնված սխալներ՝ <span class="score">${ok}/${cfg.items.length}</span></p><button class="btn small">Նորից</button>`; $("button", body).onclick = () => { k = 0; ok = 0; show(); }; save(sc); return; }
    const it = cfg.items[k];
    body.innerHTML = `<div class="q">${fmt(it.task)}</div><p style="font-size:14px;color:#5b6475">Սեղմի՛ր այն քայլի վրա, որտեղ սխալ է թույլ տրված։</p>${it.steps.map((s, i) => `<div class="chip" style="display:block" data-i="${i}">${i + 1}) ${fmt(s)}</div>`).join("")}<div class="fb"></div>`;
    let tried = false;
    $$(".chip", body).forEach((c) => (c.onclick = () => { if (c.classList.contains("done")) return; const i = +c.dataset.i; const fb = $(".fb", body); if (i === it.bad) { c.classList.add("done"); if (!tried) ok++; fb.className = "fb ok"; fb.innerHTML = "Ճիշտ է։ " + fmt(it.why) + " <button class='btn small'>Հաջորդը</button>"; $("button", fb).onclick = () => { k++; show(); }; } else { tried = true; c.classList.add("bad"); fb.className = "fb no"; fb.innerHTML = "Այս քայլը ճիշտ է։ Փնտրի՛ր նորից։"; } }));
  };
  show();
};

/* Թվային մարզում՝ գեներացվող առաջադրանքներով */
const GEN = {
  pyth() { const t = pick([[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [6, 8, 10], [9, 12, 15], [20, 21, 29], [12, 16, 20]]); return Math.random() < 0.5 ? { q: `Ուղղանկյուն եռանկյան էջերն են ${t[0]} և ${t[1]}։ Գտի՛ր ներքնաձիգը։`, a: t[2] } : { q: `Ուղղանկյուն եռանկյան ներքնաձիգը ${t[2]} է, էջերից մեկը՝ ${t[0]}։ Գտի՛ր մյուս էջը։`, a: t[1] }; },
  thirdAngle() { const a = rnd(20, 100), b = rnd(15, 160 - a); return Math.random() < 0.6 ? { q: `Եռանկյան երկու անկյուններն են ${a}° և ${b}°։ Գտի՛ր երրորդը։`, a: 180 - a - b } : { q: `Եռանկյան երկու անկյուններն են ${a}° և ${b}°։ Գտի՛ր երրորդ անկյանն առընթեր արտաքին անկյունը։`, a: a + b }; },
  adjacent() { const a = rnd(10, 170); return pick([{ q: `Անկյունը ${a}° է։ Գտի՛ր նրա կից անկյունը։`, a: 180 - a }, { q: `Անկյունը ${a}° է։ Գտի՛ր նրա հակադիր անկյունը։`, a: a }, { q: `Երկու կից անկյուններից մեկը ${a}°-ով մեծ է մյուսից։ Գտի՛ր փոքր անկյունը։`, a: (180 - a) / 2 }]); },
  polyAngle() { const n = rnd(3, 12); return pick([{ q: `Գտի՛ր ուռուցիկ ${n}-անկյան ներքին անկյունների գումարը (աստիճաններով)։`, a: 180 * (n - 2) }, { q: `Քանի՞ անկյունագիծ ունի ${n}-անկյունը։`, a: (n * (n - 3)) / 2 }, { q: `Գտի՛ր կանոնավոր ${n}-անկյան ներքին անկյունը։`, a: (180 * (n - 2)) / n }]); },

      { h: "5. Մակերեսը՝ «կամուրջ»", x: "Եթե պետք է գտնել բարձրություն, r կամ R, նախ գտի՛ր մակերեսը ամենահարմար բանաձևով, հետո օգտվի՛ր h = 2S/a, r = S/p, R = abc/(4S)։", ex: "Կողմերը 17, 25, 28 ⇒ S = 210 ⇒ h₂₈ = 15, r = 6 (Գլ. 2, №17)։", why: "Մակերեսը կապում է եռանկյան բոլոր տարրերը մի հավասարությամբ։", when: "Եռանկյուններում և արտագծյալ բազմանկյուններում։" },
      { h: "6. Կոորդինատներ «հարմար» տեղում", x: "Ուղղանկյուն եռանկյան ուղիղ անկյունը դիր (0; 0)-ում, իսկ հավասարասրուն սեղանը՝ համաչափ Oy-ի նկատմամբ։ Կենտրոնների, հեռավորությունների հարցերը կդառնան թվաբանություն։", ex: "Էջեր 6 և 8. I(2; 2), O(4; 3) ⇒ OI = √5 (մաս 1, №11)։ Սեղան 2 և 14, h = 8 ⇒ R² = 50 (Գլ. 2, №30)։", why: "Ներգծյալի կենտրոնը երկու էջերից հեռու է r-ով, իսկ համաչափության առանցքի վրա կենտրոնի x = 0։", when: "Երբ պատկերն ունի ուղիղ անկյուն կամ համաչափության առանցք։" },

    { t: "Ինչպես ընտրել ճիշտ բանաձևը", items: [
      { h: "7. Եռանկյան լուծման աղյուսակ", x: "Երեք կողմ → Հերոն / կոսինուսներ։ Երկու կողմ + միջի անկյուն → կոսինուսներ, ½ab sin C։ Կողմ + դիմացի անկյուն → սինուսներ, R։ Ուղղանկյուն → Պյութագորաս, sin/cos։", ex: "AB = 5, AC = 8, ∠A = 60° ⇒ BC = 7 (կոսինուսներ), S = 10√3 (½bc sin A)։", why: "Յուրաքանչյուր բանաձև պահանջում է իր տվյալների հավաքածուն։", when: "Ցանկացած եռանկյուն։" },
      { h: "8. k և k²", x: "Նման պատկերներում բոլոր գծային մեծությունները (կողմ, պարագիծ, բարձրություն, R, r) հարաբերում են ինչպես k, մակերեսները՝ ինչպես k²։ Մակերեսներից անցիր գործակցին արմատով։", ex: "S_{AED} = 9, S_{DFC} = 16 ⇒ AD : DC = 3 : 4, S_{ABC} = (3 + 4)² = 49 (մաս 2, №12)։", why: "Մակերեսը երկու գծային չափերի արտադրյալ է. երկուսն էլ մեծանում են k անգամ։", when: "Միայն նման պատկերների համար։" },
      { h: "9. Սեղանի անկյունագծերի կանոնը", x: "S_{AOB} = S_{COD} = √(S_{BOC}·S_{AOD}), S_{սեղան} = (√S_{BOC} + √S_{AOD})²։", ex: "AD = 3BC, S_{BOC} = 12 ⇒ S_{AOD} = 108, S_{AOB} = 36 (Գլ. 2, №35)։", why: "AOB և BOC եռանկյունները ունեն ընդհանուր բարձրություն, նրանց մակերեսները հարաբերում են ինչպես AO : OC = k։", when: "Ցանկացած սեղանում։" },
      { h: "10. Կանոնավոր եռանկյան «շղթա»", x: "r → h = 3r → R = 2r → a = 2r√3 → S = a²√3/4։", ex: "r = 2 ⇒ R = 4, h = 6, a = 4√3, S = 12√3 (մաս 1, №10)։", why: "Կենտրոնը միջնագծերի հատման կետն է և բարձրությունը բաժանում է 2 : 1։", when: "Միայն հավասարակողմ եռանկյան համար։" },

    { t: "Ինչին ուշադրություն դարձնել և քննական հնարքներ", items: [
      { h: "11. Ստուգում տեղադրմամբ", x: "«Ո՞րն է հավասարումը» հարցերում մի՛ արտածիր հավասարումը. տեղադրի՛ր տրված կետերը պատասխանների մեջ։", ex: "B(1; −4), C(5; 2). 3x − 2y − 11 = 0՝ 3 + 8 − 11 = 0 ✓, 15 − 4 − 11 = 0 ✓ (մաս 1, Բաժ. 10, №14)։", why: "Ուղիղը որոշվում է երկու կետով, շրջանագիծը՝ կենտրոնով և մեկ կետով. եթե տարբերակը բավարարում է բոլորին, այն ճիշտն է։", when: "Ընտրովի պատասխանով առաջադրանքներում։" },

      { h: "13. Գնահատում «աչքաչափով»", x: "Լուծելուց հետո ստուգի՛ր իմաստը. ներքնաձիգը ամենամեծն է, բարձրությունը փոքր է կողմից, r < R, միջնագիծը փոքր է կից կողմերի կիսագումարից։", ex: "Եթե ստացել ես, որ հավասարակողմ եռանկյան r = 10, իսկ R = 5, սխալ կա։", why: "Երկրաչափական անհավասարությունները երբեք չեն խախտվում։", when: "Միշտ՝ վերջնական պատասխանից առաջ։" },
      { h: "14. Աստիճանների րոպեներ", x: "0,5° = 30′, 0,25° = 15′, 0,75° = 45′։ Պատասխաններում 72,5°-ը գրվում է 72°30′, ոչ թե 72°50′։", ex: "Կիսորդների անկյունը 72,5° = 72°30′ (մաս 1, №16)։", why: "1° = 60′, ոչ թե 100′։", when: "Երբ անկյունը ստացվում է տասնորդական թվով։" },
      { h: "15. «Պնդումների փունջ»-ի մարտավարություն", x: "Գլուխ 3-ում նախ հաշվի՛ր պատկերի բոլոր հիմնական տարրերը (կողմեր, h, R, r, S), հետո յուրաքանչյուր պնդում համեմատի՛ր պատրաստի թվերի հետ։", ex: "a = 12√3 ⇒ h = 18, R = 12, r = 6, S = 108√3. վեց պնդումը ստուգվում է մեկ րոպեում (Գլ. 3, №2)։", why: "Պնդումները վերաբերում են նույն պատկերին. մեկ անգամ հաշվելը բավական է։", when: "Գլուխ 3-ի առաջադրանքներում։" },

  bankIntro: "Այստեղ հավաքված են դասերում մանրամասն լուծված բոլոր շտեմարանային առաջադրանքները։ Յուրաքանչյուրի պայմանը և համարը պահպանված են ճիշտ այնպես, ինչպես շտեմարանում, իսկ պատասխանները ստուգվում են շտեմարանի պաշտոնական բանալիով։",

  finalIntro: "Աշխատանքը ներառում է հարցեր բոլոր 18 դասերից։ Պատասխանի՛ր բոլոր հարցերին, հետո սեղմի՛ր «Ավարտել»։ Արդյունքում կտեսնես, թե որ թեմաներն են պետք կրկնել։",
